<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Explorer l’Ennéagramme</title>

  <style>html{background:#070b14}</style>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/app.css?v=202" />
  <link rel="stylesheet" href="assets/css/type.css?v=202" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1XYJK71TC4"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-1XYJK71TC4');
</script>

  <style>
    .nodeValue{ white-space: pre-line; }
    .nodeCard{ white-space: normal; }
    .heroActions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }

    .heroBtn{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 12px;
      border-radius:12px;
      text-decoration:none;
      font-weight:600;
      color: var(--text);
      background: rgba(125, 211, 252, .16);
      border: 1px solid rgba(125, 211, 252, .45);
    }
    .heroBtn:hover{
      background: rgba(125, 211, 252, .24);
      border-color: rgba(125, 211, 252, .65);
      transform: translateY(-1px);
    }

    /* Masquer le Sommaire (navPanel) et laisser Catégories prendre toute la place */
    .navPanel{ display:none !important; }
    .typeGrid{ grid-template-columns: 1fr !important; }

    /* Footer already in app.css */
  </style>
</head>

<body>
  <div class="wrap typeWrap">
    <header class="typeTop">
      <a class="backBtn" href="index.html">Accueil</a>

      <div class="typeHead">
        <h1 id="exploreTitle">Explorer l’Ennéagramme</h1>
        <p id="exploreSubtitle">Histoire, concepts, niveaux 1–9, pratiques, repères</p>

        <div class="heroActions">
          <a class="heroBtn" href="test-enneagramme-sans-indice.html">Faire le test</a>
          <a class="heroBtn" href="index.html">Aller au diagramme</a>
        </div>
      </div>

      <div class="typeTools">
        <input id="searchBox" type="search" placeholder="Rechercher dans l’exploration…" />
        <button id="btnExpandAll" type="button">Tout ouvrir</button>
        <button id="btnCollapseAll" type="button">Tout fermer</button>
      </div>
    </header>

    <main class="typeGrid">
      <section class="sectionsPanel">
        <h2 class="panelTitle">Catégories</h2>
        <p class="panelHint">Clique une carte pour entrer dedans. Tu peux réorganiser les cartes en les glissant.</p>
        <div id="sectionsGrid" class="sectionsGrid"></div>
      </section>

      <aside class="navPanel">
        <h2 class="panelTitle">Sommaire</h2>
        <div id="toc" class="toc"></div>
      </aside>
    </main>

    <footer class="siteFooter">
      <div class="footerInner">
        <span class="copy">Tous droits réservés</span>
        <a class="contact" href="https://docs.google.com/forms/d/e/1FAIpQLScLBwWZA-VZf4OaIEl11fnKasayyVrll7DZL5A3uZZBCwLdkQ/viewform?usp=header" target="_blank" rel="noopener">
          ✉️ Contact
        </a>
      </div>
    </footer>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawerOverlay" id="drawerOverlay"></div>

    <div class="drawerPanel" role="dialog" aria-modal="true" aria-label="Contenu de la rubrique">
      <div class="drawerTop">
        <div class="drawerTitleRow">
          <div class="drawerIcon" id="drawerIcon">📌</div>
          <div class="drawerTitles">
            <div class="drawerTitle" id="drawerTitle">—</div>
            <div class="drawerSub" id="drawerSub">—</div>
          </div>
        </div>
        <div class="drawerActions">
          <button id="btnPin" type="button">Épingler</button>
          <button id="btnClose" type="button">Fermer</button>
        </div>
      </div>

      <div class="drawerBody">
        <div id="drawerContent" class="drawerContent"></div>
      </div>
    </div>
  </div>

  <script src="assets/js/explore.js?v=2"></script>
</body>
</html>
