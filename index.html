<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L'application a déménagé — Ennéagramme</title>
  <meta http-equiv="refresh" content="2; url=https://lemiroirinterieur.fr/" />
  <link rel="canonical" href="https://lemiroirinterieur.fr/" />
  <style>
    body {
      font-family: Georgia, 'Cormorant Garamond', serif;
      background: linear-gradient(180deg, #FDF9EE 0%, #F7EFD8 100%);
      color: #2A1B0F;
      margin: 0;
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 2rem; text-align: center;
    }
    .ornament { color: #C0A050; font-size: 2rem; letter-spacing: 1em; margin-bottom: 1.5rem; opacity: 0.7; }
    h1 { font-weight: 400; font-size: clamp(1.5rem, 4vw, 2.2rem); margin: 0 0 0.5rem; color: #1B2A4E; }
    p { font-size: 1.1rem; color: #5b4a2a; margin: 0.5rem 0; max-width: 32rem; line-height: 1.6; }
    em { color: #B8860B; font-style: italic; }
    .new-link {
      display: inline-block; margin-top: 2rem; padding: 0.9rem 2rem;
      background: #C0A050; color: #FFFDF8; text-decoration: none;
      border-radius: 999px; font-size: 1rem; letter-spacing: 0.02em;
      transition: all 0.25s ease; box-shadow: 0 4px 18px rgba(192,160,80,0.25);
    }
    .new-link:hover { background: #a88a3a; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(192,160,80,0.35); }
    .small { font-size: 0.85rem; color: #8a7a5a; margin-top: 2.5rem; font-style: italic; }
  </style>
</head>
<body>
  <div class="ornament">✦ ✦ ✦</div>
  <h1>L'ennéagramme a déménagé</h1>
  <p>L'application a trouvé sa nouvelle maison sous <em>Conscience et Présence</em>.</p>
  <a class="new-link" href="https://lemiroirinterieur.fr/">
    Continuer vers la nouvelle adresse →
  </a>
  <p class="small">Redirection automatique dans 2 secondes…</p>
  <script>
    setTimeout(function(){
      window.location.replace('https://lemiroirinterieur.fr/');
    }, 1800);
  </script>
</body>
</html>
